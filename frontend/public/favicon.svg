<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-cyan" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="fav-rim" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="fav-dark" x1="12" y1="8" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
  </defs>

  <!-- Deep High-Contrast App Tile Background (Rounded Squircle) -->
  <rect width="64" height="64" rx="14" fill="#05070D" />
  <rect width="64" height="64" rx="14" stroke="url(#fav-rim)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Outer Faceted Hex Shield -->
  <path
    d="M32 9 L54 19 L54 42 L32 55 L10 42 L10 19 Z"
    stroke="url(#fav-rim)"
    stroke-width="2"
    stroke-linejoin="round"
    fill="rgba(10, 15, 29, 0.9)"
  />

  <!-- 'P' Pillar & Loop -->
  <path
    d="M17 21 H35 C42 21 46 25 46 31 C46 37 42 41 35 41 H25 V50 L17 45 V21 Z"
    fill="url(#fav-dark)"
    stroke="#38BDF8"
    stroke-width="1"
    stroke-opacity="0.5"
  />

  <!-- 'P' Negative Space Aperture -->
  <rect x="25" y="27" width="9" height="7" rx="1.5" fill="#05070D" />

  <!-- 'X' Dynamic Spar (Electric Cyan Slash) -->
  <path
    d="M42 17 L50 22 L31 52 L23 47 Z"
    fill="url(#fav-cyan)"
  />

  <!-- 'X' Counter-Spar -->
  <path
    d="M28 41 L36 35 L50 51 L43 56 Z"
    fill="#00F2FE"
  />

  <!-- Invariance Focal Node -->
  <polygon points="32,37 36,41 32,45 28,41" fill="#FFFFFF" />
  <circle cx="32" cy="55" r="1.6" fill="#00F2FE" />
</svg>