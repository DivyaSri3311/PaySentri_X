<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="lockup-cyan" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="lockup-plate" x1="20" y1="15" x2="65" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="lockup-rim" x1="50" y1="7" x2="50" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="lockup-x-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="lockup-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (scaled & translated at x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.70)">
    <!-- Outer Shield -->
    <path
      d="M50 7 L86 23 L86 58 L50 93 L14 58 L14 23 Z"
      stroke="url(#lockup-rim)"
      stroke-width="2.5"
      stroke-linejoin="round"
      fill="rgba(10, 15, 29, 0.7)"
    />

    <!-- 'P' Monogram -->
    <path
      d="M24 25 H54 C66 25 72 31 72 41 C72 50 65 56 54 56 H37 V75 L24 67 V25 Z"
      fill="url(#lockup-plate)"
      stroke="#38BDF8"
      stroke-width="1.2"
      stroke-opacity="0.4"
    />

    <!-- 'P' Counter -->
    <path d="M37 36 H52 C57 36 60 38 60 41 C60 45 57 47 52 47 H37 V36 Z" fill="#0A0F1D" />

    <!-- 'X' Spar -->
    <path d="M66 20 L80 27 L48 78 L34 71 Z" fill="url(#lockup-cyan)" filter="url(#lockup-glow)" />

    <!-- 'X' Rising Wing -->
    <path d="M44 61 L56 52 L80 81 L68 89 Z" fill="#0284C7" filter="url(#lockup-glow)" />

    <!-- Core Nexus -->
    <polygon points="50,56 57,63 50,70 43,63" fill="#00F2FE" />
    <circle cx="50" cy="93" r="2.2" fill="#00F2FE" />
  </g>

  <!-- Typography & Tagline Lockup -->
  <g transform="translate(96, 0)">
    <text x="0" y="45" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      Pay<tspan font-weight="600" fill="#E2E8F0">Sentri</tspan><tspan font-weight="800" fill="url(#lockup-x-text)">X</tspan>
    </text>
    <text x="2" y="62" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#22D3EE" letter-spacing="0.22em" opacity="0.95">
      CYBERCUP 6.0 • CC6-AI02
    </text>
    <text x="2" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="0.03em">
      Beyond Detection. Ahead of Deception.
    </text>
  </g>
</svg>
