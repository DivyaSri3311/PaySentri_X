<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- PaySentriX Electric Cyan Gradient -->
    <linearGradient id="psx-cyan" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Dynamic Cyan Highlight Gradient -->
    <linearGradient id="psx-cyan-hi" x1="30" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Structural Midnight Titanium Plate Gradient -->
    <linearGradient id="psx-plate" x1="20" y1="15" x2="65" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Protective Rim Glow -->
    <linearGradient id="psx-rim" x1="50" y1="7" x2="50" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <filter id="psx-cyan-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Faceted Sentry Shield Frame -->
  <path
    d="M50 7 L86 23 L86 58 L50 93 L14 58 L14 23 Z"
    stroke="url(#psx-rim)"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="rgba(10, 15, 29, 0.7)"
  />

  <!-- 2. The 'P' Plate (Left Pillar & Upper Payment Vault Loop) -->
  <path
    d="M24 25 H54 C66 25 72 31 72 41 C72 50 65 56 54 56 H37 V75 L24 67 V25 Z"
    fill="url(#psx-plate)"
    stroke="#38BDF8"
    stroke-width="1.2"
    stroke-opacity="0.4"
  />

  <!-- 3. The 'P' Inner Aperture (Negative Space Counter) -->
  <path
    d="M37 36 H52 C57 36 60 38 60 41 C60 45 57 47 52 47 H37 V36 Z"
    fill="#0A0F1D"
  />

  <!-- 4. The 'X' Verification Spar (Electric Cyan Descending Diagonal) -->
  <path
    d="M66 20 L80 27 L48 78 L34 71 Z"
    fill="url(#psx-cyan)"
    filter="url(#psx-cyan-glow)"
  />

  <!-- 5. The 'X' Rising Dynamic Wing (Anchoring into Sentry Apex) -->
  <path
    d="M44 61 L56 52 L80 81 L68 89 Z"
    fill="url(#psx-cyan-hi)"
    filter="url(#psx-cyan-glow)"
  />

  <!-- 6. Invariance Core Nexus (The Mathematical Verification Point) -->
  <polygon
    points="50,56 57,63 50,70 43,63"
    fill="#00F2FE"
  />

  <!-- 7. Precision Telemetry Nodes -->
  <circle cx="50" cy="93" r="2.2" fill="#00F2FE" />
  <circle cx="50" cy="7" r="1.8" fill="#38BDF8" />
</svg>
